<form id="mfa-alternative-options"
    action="{% url 'request_mfa' 'none' %}"
    enctype="multipart/form-data"
    method="POST"
    class="w-full max-w-lg mx-auto px-4 sm:px-0"
>
    {% include 'users/modals/mfa/data/in_circulation.html' %}

    <!-- Header -->
    <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-purple-500/30 to-transparent"></div>
        <h5 class="text-xs sm:text-sm font-semibold text-white/80 tracking-[0.15em] uppercase whitespace-nowrap">
            Alternative Options
        </h5>
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-purple-500/30 to-transparent"></div>
    </div>

    <!-- Content -->
    <div>
        {% if not otp_services.email and not otp_services.sms %}
        <!-- Unavailable State -->
            <div class="space-y-3 sm:space-y-4 mb-5">
                <div class="flex items-center gap-3 justify-center">
                    <!-- Warning Icon -->
                    <div class="p-2.5 sm:p-3 bg-amber-500/10 rounded-full">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <span class="flex-1 max-w-16 h-px bg-white/20"></span>
                </div>

                <!-- Text -->
                <div>
                    <p class="text-sm sm:text-base text-white/70 leading-relaxed">
                        <strong>Email</strong> and <strong>SMS</strong> services are temporarily 
                        <span class="text-amber-400 font-semibold">unavailable</span>
                    </p>
                    <p class="text-xs sm:text-sm text-white/40 mt-1">
                        For further assistance, head to our contact page
                    </p>
                </div>

                <!-- Contact Support Team button -->
                <a href="{% url 'contact' %}" class="w-full sm:w-auto">
                    <button type="button" class="relative group w-full px-6 sm:px-8 py-4 sm:py-4.5 bg-gradient-to-r from-purple-500/10 to-purple-600/10 hover:from-purple-500/20 hover:to-purple-600/20 text-white text-sm sm:text-base font-medium rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-purple-500/10 hover:shadow-purple-500/20">
                        <span class="relative flex items-center justify-center gap-2">
                            <!-- Phone Icon -->
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                            </svg>
                        <span class="font-semibold text-white">Contact Support Team</span></span>
                        
                        <!-- Hover Glow Effect -->
                        <span class="absolute inset-0 -z-10 bg-gradient-to-r from-purple-500/0 via-purple-500/10 to-purple-500/0 opacity-0 group-hover:opacity-100 rounded-xl transition-opacity duration-500"></span>
                    </button>
                </a>
            </div>
        {% else %}
            <!-- Available State -->
            <div class="space-y-3 sm:space-y-4">
                <div class="flex items-center gap-3 justify-center">
                    <p class="text-sm sm:text-base text-white/60 text-center">
                        Send OTP via
                    </p>
                    <span class="flex-1 max-w-16 h-px bg-white/20"></span>
                </div>
                
                <!-- Email Button -->
                <button type="button"
                    class="relative group w-full px-4 sm:px-6 py-4 sm:py-4.5 bg-gradient-to-r from-purple-500/10 to-purple-600/10 hover:from-purple-500/20 hover:to-purple-600/20 text-white text-sm sm:text-base font-medium rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] {% if otp_services.email %}shadow-lg shadow-purple-500/10 hover:shadow-purple-500/20{% else %}opacity-40 cursor-not-allowed{% endif %}"
                    {% if otp_services.email %}
                        hx-post="{% url 'request_mfa' 'otp_email' %}"
                        hx-trigger="click throttle:1s"
                        hx-swap="none"
                    {% else %}
                        disabled
                    {% endif %}>
                    
                    <span class="relative flex items-center justify-center gap-3">
                        <!-- Email Icon -->
                        <div class="p-1.5 bg-purple-500/20 rounded-lg">
                            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        
                        <span class="font-semibold text-white">Email</span>
                        
                        {% if otp_services.email %}
                            <span class="flex items-center gap-2 ml-auto">
                                <!-- Enhanced Pulse Indicator -->
                                <span class="relative flex h-3 w-3">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-400 shadow-lg shadow-emerald-400/50"></span>
                                </span>
                                <span class="text-xs font-semibold text-emerald-400 tracking-wide uppercase">Active</span>
                            </span>
                        {% else %}
                            <span class="ml-auto text-xs text-white/30 font-medium">Unavailable</span>
                        {% endif %}
                    </span>
                    
                    <!-- Hover Glow Effect -->
                    {% if otp_services.email %}
                        <span class="absolute inset-0 -z-10 bg-gradient-to-r from-purple-500/0 via-purple-500/10 to-purple-500/0 opacity-0 group-hover:opacity-100 rounded-xl transition-opacity duration-500"></span>
                    {% endif %}
                </button>

                <!-- SMS Button -->
                <button type="button"
                    class="relative group w-full px-4 sm:px-6 py-4 sm:py-4.5 bg-gradient-to-r from-purple-500/10 to-purple-600/10 hover:from-purple-500/20 hover:to-purple-600/20 text-white text-sm sm:text-base font-medium rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] {% if otp_services.sms %}shadow-lg shadow-purple-500/10 hover:shadow-purple-500/20{% else %}opacity-40 cursor-not-allowed{% endif %}"
                    {% if otp_services.sms %}
                        hx-post="{% url 'request_mfa' 'otp_sms' %}"
                        hx-trigger="click throttle:1s"
                        hx-swap="none"
                    {% else %}
                        disabled
                    {% endif %}>
                    
                    <span class="relative flex items-center justify-center gap-3">
                        <!-- SMS Icon -->
                        <div class="p-1.5 bg-purple-500/20 rounded-lg">
                            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                            </svg>
                        </div>
                        
                        <span class="font-semibold text-white">SMS</span>
                        
                        {% if otp_services.sms %}
                            <span class="flex items-center gap-2 ml-auto">
                                <!-- Enhanced Pulse Indicator -->
                                <span class="relative flex h-3 w-3">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-400 shadow-lg shadow-emerald-400/50"></span>
                                </span>
                                <span class="text-xs font-semibold text-emerald-400 tracking-wide uppercase">Active</span>
                            </span>
                        {% else %}
                            <span class="ml-auto text-xs text-white/30 font-medium">Unavailable</span>
                        {% endif %}
                    </span>
                    
                    <!-- Hover Glow Effect -->
                    {% if otp_services.sms %}
                        <span class="absolute inset-0 -z-10 bg-gradient-to-r from-purple-500/0 via-purple-500/10 to-purple-500/0 opacity-0 group-hover:opacity-100 rounded-xl transition-opacity duration-500"></span>
                    {% endif %}
                </button>
            </div>
        {% endif %}
    </div>
</form>
