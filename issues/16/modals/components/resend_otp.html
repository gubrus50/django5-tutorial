{% load static %}
<div class="otp-container">
    <!-- Resend Button - Left on desktop -->
    <button type="button" class="btn resend-btn bg-gradient-to-r from-purple-500/10 to-pink-500/10 hover:from-purple-500/20 hover:to-pink-500/20 text-purple-400 hover:text-purple-300 font-medium rounded-xl border border-purple-500/20 hover:border-purple-500/50 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:border-purple-500/20 shadow-sm hover:shadow-lg hover:shadow-purple-500/10">
        <span class="spinner-border inline-block animate-spin sr-only" role="status" aria-hidden="true">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="16" d="M232.167,51.71582v48a8.00039,8.00039,0,0,1-8,8h-48a8.00065,8.00065,0,0,1-5.65722-13.65723l18.34277-18.34277-4.28418-4.28418a80.08769,80.08769,0,0,0-113.13672,0A8.00052,8.00052,0,0,1,60.11719,60.11719a96.11137,96.11137,0,0,1,135.76562,0l4.28418,4.28418,18.34278-18.34278A8.00065,8.00065,0,0,1,232.167,51.71582ZM184.56836,184.56836a80.08769,80.08769,0,0,1-113.13672,0l-4.28418-4.28418,18.34277-18.34277A8.00065,8.00065,0,0,0,79.833,148.28418h-48a8.00039,8.00039,0,0,0-8,8v48a8.00052,8.00052,0,0,0,13.65722,5.65723L55.833,191.59863l4.28418,4.28418a96.11136,96.11136,0,0,0,135.76562,0,8.00052,8.00052,0,0,0-11.31445-11.31445Z"/>
            </svg>
        </span>
        <span class="button-text flex items-center justify-center gap-2">
            <svg class="w-4 h-4 sm:!hidden" fill="none" stroke="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="16" d="M232.167,51.71582v48a8.00039,8.00039,0,0,1-8,8h-48a8.00065,8.00065,0,0,1-5.65722-13.65723l18.34277-18.34277-4.28418-4.28418a80.08769,80.08769,0,0,0-113.13672,0A8.00052,8.00052,0,0,1,60.11719,60.11719a96.11137,96.11137,0,0,1,135.76562,0l4.28418,4.28418,18.34278-18.34278A8.00065,8.00065,0,0,1,232.167,51.71582ZM184.56836,184.56836a80.08769,80.08769,0,0,1-113.13672,0l-4.28418-4.28418,18.34277-18.34277A8.00065,8.00065,0,0,0,79.833,148.28418h-48a8.00039,8.00039,0,0,0-8,8v48a8.00052,8.00052,0,0,0,13.65722,5.65723L55.833,191.59863l4.28418,4.28418a96.11136,96.11136,0,0,0,135.76562,0,8.00052,8.00052,0,0,0-11.31445-11.31445Z"/>
            </svg>
            <span class="whitespace-nowrap">Resend OTP</span>
        </span>
    </button>

    <!-- Countdown Timer - Middle -->
    <div class="count-text text-purple-400 text-center timer-wrapper">
        <span class="count-down font-mono text-2xl sm:text-3xl font-bold tabular-nums">--</span>
        <br>
        <span class="text-[10px] sm:text-xs text-gray-500 uppercase tracking-wider timer-label">seconds</span>
    </div>

    <!-- Image - Right -->
    <img class="otp-image object-contain" src="{% static image_path %}" alt="{{ image_name }}">

    <style>
    .otp-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        min-width: 0;
        width: 100%;
    }

    /* Resend Button - Left */
    .resend-btn {
        flex: 1;
        min-width: 0;
        padding: 0.625rem 0.75rem;
        height: 75px;
        font-size: 0.875rem;
        order: 0;
    }

    /* Timer - Middle */
    .timer-wrapper {
        flex-shrink: 0;
        min-width: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        order: 1;
    }

    /* Image - Right */
    .otp-image {
        height: 8rem;
        width: auto;
        flex-shrink: 0;
        order: 2;
    }

    /* Hide the SVG icon on desktop */
    .resend-btn .button-text svg {
        display: none;
    }

    /* Show SVG icon only on mobile */
    @media (max-width: 640px) {
        .resend-btn .button-text svg {
            display: inline-block;
        }
    }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 640px) {
        .otp-container {
            flex-direction: column;
            gap: 0.75rem;
            align-items: stretch;
        }

        /* Timer - Top */
        .timer-wrapper {
            min-width: unset;
            width: 100%;
            order: -1;
            margin-top: 0.75rem;
        }

        .timer-wrapper .count-down {
            font-size: 1.5rem;
        }

        .timer-wrapper .timer-label {
            font-size: 0.625rem;
        }

        /* Button - Middle (Full Width) */
        .resend-btn {
            flex: none;
            width: 100%;
            height: auto;
            min-height: 48px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            order: 0;
        }

        /* Image - Hidden on mobile */
        .otp-image {
            display: none;
        }
    }

    @media (max-width: 400px) {
        .resend-btn {
            font-size: 0.75rem;
            padding: 0.625rem 0.75rem;
            min-height: 44px;
        }

        .timer-wrapper .count-down {
            font-size: 1.25rem;
        }
        
        .timer-wrapper {
            margin-top: 0.5rem;
        }
    }
    </style>

    <script type="text/javascript">
    (() => {

        let script = document.currentScript,
            parent = script.parentElement,

            counter = parent.querySelector('.count-down'),
            countTxt = parent.querySelector('.count-text'),
            button = parent.querySelector('.btn'),

            buttonTxt = button.querySelector('.button-text'),
            spinner = button.querySelector('.spinner-border'),

            timeout = null,
            fallback = null,
            interval = null,
            isIntervalActive = false,
            count = 0;
        

        function countDown() {
            counter.innerText = String(count).padStart(2, '0');
            if (count > 0) {
                count -= 1;
                spinner.classList.remove('sr-only');
                buttonTxt.classList.add('sr-only');
            } else {
                clearInterval(interval);
                button.removeAttribute('disabled');
                countTxt.classList.remove('text-purple-400');
                countTxt.classList.add('text-gray-400');
                isIntervalActive = false;
                spinner.classList.add('sr-only');
                buttonTxt.classList.remove('sr-only');
            }
        }
        

        function TREDSecondsLeft() {
            const cookie = getCookie('throttle_otp_request_expiry_date');
            
            const expiryDate = cookie ? new Date(cookie) : null;
            
            if (expiryDate && !isNaN(expiryDate.getTime())) {
                const now = new Date();
                const secondsLeft = Math.floor((expiryDate - now) / 1000) + 1;
                return secondsLeft > 0 ? secondsLeft : 0;
            }
            
            return null;
        }


        button.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (count > 0) return;

            htmx.ajax('POST', '{{ post_url }}', {
                swap: 'none',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                }
            });
            
            timeout = setTimeout(() => {
                spinner.classList.remove('sr-only');
                buttonTxt.classList.add('sr-only');
            }, 500);

            fallback = setTimeout(() => {
                console.warn('No response received in 15 seconds, executing fallback.');
                buttonTxt.classList.remove('sr-only'); 
                spinner.classList.add('sr-only');
            }, 15000);
        });


        function setThrottle() {
            if (isIntervalActive) return;
            count = TREDSecondsLeft() ?? {{ OTP_REQUEST_THROTTLE_INTERVAL }};

            button.setAttribute('disabled', '');
            countTxt.classList.remove('text-gray-400');
            countTxt.classList.add('text-purple-400');

            isIntervalActive = true;
            if (interval) clearInterval(interval);
            countDown();
            interval = setInterval(countDown, 1000);
            
            spinner.classList.remove('sr-only');
            buttonTxt.classList.add('sr-only');
        }
        setThrottle();


        document.addEventListener('htmx:afterRequest', async (event) => {
            if (event.detail.pathInfo.requestPath !== '{{ post_url }}') return;

            let xhr = event.detail.xhr,
                responseText = await xhr.responseText,
                response = '';

            if (xhr.getResponseHeader('Content-Type')?.includes('application/json')) {
                response = JSON.parse(responseText);
            }
            else return;

            clearTimeout(timeout);
            clearTimeout(fallback);

            if (response.success === 'OTP Sent') setThrottle();
            else if (response.error) console.error(response.error);

        });

        script.remove();

    })();
    </script>
</div>
